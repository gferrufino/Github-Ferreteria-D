name: Python CI - Ferretería D

on:
  push:
    branches: [ main, dev, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f src/requirements.txt ]; then
            pip install -r src/requirements.txt
          else
            pip install streamlit pandas pytest
          fi

      - name: Run tests (si existen)
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No hay carpeta tests/, omitiendo pruebas."
          fi

      - name: Smoke test (import básico)
        run: |
          python -c "import importlib; importlib.import_module('menu'); importlib.import_module('login'); importlib.import_module('orden_compra'); print('OK imports')"
        working-directory: src
