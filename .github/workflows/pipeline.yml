name: Python CI - Ferretería D

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install streamlit pandas pytest
          fi

      # Importante si tu app está en src/
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}/src" >> $GITHUB_ENV

      - name: Run tests (si existen)
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No hay carpeta tests/, omitiendo pruebas."
          fi

      - name: Smoke test (import básico)
        run: |
          python -c "import sys; print(sys.path)"
          python -c "import importlib; importlib.import_module('app'); print('OK: src/app.py importa bien')"
        working-directory: src
