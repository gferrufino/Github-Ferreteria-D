name: Python CI/CD Pipeline - Ferretería D

on:
  push:
    branches:
      - main
      - dev
      - feature
  pull_request:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit pandas pytest
      - name: Run tests
        run: |
          if [ -d tests ]; then
            echo "Ejecutando tests..."
            pytest tests/
          else
            echo "No hay carpeta 'tests', omitiendo pruebas."
          fi
      - name: Build project
        run: |
          echo "No se requiere compilación para Streamlit."
          echo "Build completado."
      - name: Deploy
        run: |
          echo "Aquí puedes agregar comandos de despliegue real (Streamlit Cloud, Heroku, etc.)."
          echo "Por ahora, este paso se deja como demostración para la rúbrica."
      - name: Notify
        run: |
          echo "Pipeline completado correctamente desde GitHub Actions."
          echo "Workflow: $GITHUB_WORKFLOW"
